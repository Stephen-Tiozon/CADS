<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 820" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .system-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
      .actor-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .actor-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .uc-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .rel-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-style: italic; fill: #475569; text-anchor: middle; }
      .system-rect { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; rx: 6; }
      .uc-oval { fill: #ffffff; stroke: #0f172a; stroke-width: 1.8; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.03)); }
      .uc-primary { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; }
      .uc-included { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; }
      .uc-admin { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; }
      .stickman { stroke: #0f172a; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .stickman-head { stroke: #0f172a; stroke-width: 2.4; fill: #ffffff; }
      .assoc-line { stroke: #334155; stroke-width: 1.6; }
      .dashed-rel { stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="1060" height="820" fill="#ffffff" />
  <text x="530" y="32" text-anchor="middle" class="main-title">CADS - Assessment Subsystem Use Case Diagram</text>

  <!-- System Boundary -->
  <rect x="220" y="55" width="640" height="735" class="system-rect" />
  <text x="540" y="82" text-anchor="middle" class="system-title">Subsystem: Assessment (CADS)</text>

  <!-- ================= USE CASES ================= -->
  <!-- Core Hub -->
  <g id="uc-assess">
    <ellipse cx="370" cy="180" rx="110" ry="28" class="uc-primary" />
    <text x="370" y="180" class="uc-label" fill="#1d4ed8">Conduct Case Assessment</text>
  </g>

  <!-- 4 Instruments -->
  <g id="uc-lmd">
    <ellipse cx="690" cy="115" rx="120" ry="24" class="uc-included" />
    <text x="690" y="115" class="uc-label">Administer LMD (Discernment)</text>
  </g>

  <g id="uc-ivj">
    <ellipse cx="690" cy="175" rx="120" ry="24" class="uc-included" />
    <text x="690" y="175" class="uc-label">Administer IVJ (Vulnerability)</text>
  </g>

  <g id="uc-cfc">
    <ellipse cx="690" cy="235" rx="120" ry="24" class="uc-included" />
    <text x="690" y="235" class="uc-label">Administer CFC (Community)</text>
  </g>

  <g id="uc-ffc">
    <ellipse cx="690" cy="295" rx="120" ry="24" class="uc-included" />
    <text x="690" y="295" class="uc-label">Administer FFC (Family Factors)</text>
  </g>

  <!-- Scoring & Recommendation -->
  <g id="uc-score">
    <ellipse cx="690" cy="370" rx="120" ry="25" class="uc-included" />
    <text x="690" y="370" class="uc-label">Calculate Scores</text>
  </g>

  <g id="uc-recommend">
    <ellipse cx="690" cy="445" rx="120" ry="25" class="uc-included" />
    <text x="690" y="445" class="uc-label">Generate Recommendation</text>
  </g>

  <!-- View Results -->
  <g id="uc-view">
    <ellipse cx="410" cy="520" rx="110" ry="26" class="uc-oval" />
    <text x="410" y="520" class="uc-label">View Assessment Results</text>
  </g>

  <!-- Export Report -->
  <g id="uc-export">
    <ellipse cx="690" cy="520" rx="115" ry="25" class="uc-oval" />
    <text x="690" y="520" class="uc-label">Export Assessment Report (PDF)</text>
  </g>

  <!-- Admin: Configure Assessment -->
  <g id="uc-config">
    <ellipse cx="650" cy="670" rx="130" ry="28" class="uc-admin" />
    <text x="650" y="670" class="uc-label" fill="#b91c1c">Configure Question Bank &amp; Tools</text>
  </g>

  <!-- Audit Logs -->
  <g id="uc-audit">
    <ellipse cx="360" cy="670" rx="100" ry="24" class="uc-oval" />
    <text x="360" y="670" class="uc-label">Audit Assessment Logs</text>
  </g>


  <!-- ================= RELATIONSHIPS ================= -->
  <!-- Conduct Assess ..> LMD -->
  <path d="M 465 160 L 575 125" class="dashed-rel" />
  <text x="515" y="132" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- Conduct Assess ..> IVJ -->
  <path d="M 480 178 L 570 175" class="dashed-rel" />
  <text x="525" y="168" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- Conduct Assess ..> CFC -->
  <path d="M 465 198 L 575 225" class="dashed-rel" />
  <text x="520" y="222" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- Conduct Assess ..> FFC -->
  <path d="M 445 205 L 580 280" class="dashed-rel" />
  <text x="510" y="255" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- Conduct Assess ..> Calculate Scores -->
  <path d="M 410 208 L 600 355" class="dashed-rel" />
  <text x="490" y="300" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- Calculate Scores ..> Generate Recommendation -->
  <path d="M 690 395 L 690 420" class="dashed-rel" />
  <text x="735" y="410" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- Export Report ..> View Results (Extend) -->
  <path d="M 575 520 L 520 520" class="dashed-rel" />
  <text x="548" y="512" class="rel-label">&lt;&lt;extend&gt;&gt;</text>

  <!-- Configure ..> Audit -->
  <path d="M 520 670 L 460 670" class="dashed-rel" />
  <text x="490" y="662" class="rel-label">&lt;&lt;include&gt;&gt;</text>


  <!-- ================= STICKMAN: SOCIAL WORKER (LEFT) ================= -->
  <g id="actor-sw">
    <circle cx="95" cy="270" r="22" class="stickman-head" />
    <line x1="95" y1="292" x2="95" y2="355" class="stickman" />
    <line x1="60" y1="318" x2="130" y2="318" class="stickman" />
    <line x1="95" y1="355" x2="65" y2="415" class="stickman" />
    <line x1="95" y1="355" x2="125" y2="415" class="stickman" />
    <text x="95" y="445" class="actor-title">Social Worker</text>
    <text x="95" y="462" class="actor-sub">(Case Assessor)</text>
  </g>

  <!-- ================= STICKMAN: ADMIN (RIGHT) ================= -->
  <g id="actor-admin">
    <circle cx="965" cy="520" r="22" class="stickman-head" />
    <line x1="965" y1="542" x2="965" y2="605" class="stickman" />
    <line x1="930" y1="568" x2="1000" y2="568" class="stickman" />
    <line x1="965" y1="605" x2="935" y2="665" class="stickman" />
    <line x1="965" y1="605" x2="995" y2="665" class="stickman" />
    <text x="965" y="695" class="actor-title">Admin</text>
    <text x="965" y="712" class="actor-sub">(System Supervisor)</text>
  </g>


  <!-- ================= ASSOCIATIONS ================= -->
  <!-- SW to Conduct Case Assessment -->
  <line x1="130" y1="318" x2="270" y2="195" class="assoc-line" />
  <!-- SW to View Results -->
  <line x1="130" y1="318" x2="310" y2="510" class="assoc-line" />

  <!-- Admin to View Results -->
  <line x1="930" y1="568" x2="520" y2="525" class="assoc-line" />
  <!-- Admin to Configure Tools -->
  <line x1="930" y1="568" x2="775" y2="655" class="assoc-line" />
</svg>
