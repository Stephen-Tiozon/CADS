<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CADS Rule-Based Algorithm Flowchart (A4 Portrait)</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #334155;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      position: sticky;
      top: 16px;
      z-index: 50;
    }
    .toolbar-title {
      color: #f8fafc;
      font-weight: 700;
      font-size: 13px;
      margin-right: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: #0284c7;
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
    }
    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-secondary:hover {
      background: #475569;
      color: white;
    }

    /* A4 Portrait Paper Container */
    .a4-sheet {
      width: 210mm;
      min-height: 297mm;
      height: 297mm;
      background: #ffffff;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .a4-sheet svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media print {
      body {
        background: transparent !important;
        padding: 0 !important;
      }
      .toolbar {
        display: none !important;
      }
      .a4-sheet {
        width: 100vw !important;
        height: 100vh !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
      }
    }
  </style>
</head>
<body>

  <!-- Controls Toolbar -->
  <div class="toolbar">
    <div class="toolbar-title">
      <span>CADS Rule-Based Flowchart</span>
      <span class="badge">A4 PORTRAIT</span>
    </div>
    <button class="btn btn-primary" onclick="window.print()">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
      </svg>
      Print / Save as PDF (1 Page)
    </button>
    <a class="btn btn-secondary" href="/cads-rule-based-algorithm-flowchart.svg" download="CADS_Rule_Based_Algorithm_Flowchart.svg">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
      Download SVG
    </a>
    <a class="btn btn-secondary" href="/cads-rule-based-algorithm-flowchart.drawio" download="CADS_Rule_Based_Algorithm_Flowchart.drawio">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
      </svg>
      Download draw.io
    </a>
  </div>

  <!-- A4 Single-Page Sheet -->
  <div class="a4-sheet">
    <object data="/cads-rule-based-algorithm-flowchart.svg" type="image/svg+xml" style="width: 100%; height: 100%;">
      <!-- Fallback image -->
      <img src="/cads-rule-based-algorithm-flowchart.svg" alt="CADS Rule-Based Algorithm Flowchart" style="width:100%; height:100%;" />
    </object>
  </div>

</body>
</html>
